<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動地圖產生器 Event Map Builder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Intro.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.0.0/introjs.min.css" />
    
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 頂部導覽列 -->
    <header class="header">
        <div class="header-left">
            <h1 class="logo">📍 活動地圖產生器</h1>
            <span class="version">v2.0</span>
        </div>
        <div class="header-right">
            <button id="btn-projects" class="btn btn-secondary" title="專案管理" data-intro="1">
                📁 專案
            </button>
            <button id="btn-event-info" class="btn btn-secondary" title="活動資訊" data-intro="2">
                📋 資訊
            </button>
            <button id="btn-export" class="btn btn-secondary" title="匯出 JSON">
                💾 匯出
            </button>
            <button id="btn-import" class="btn btn-secondary" title="匯入">
                📂 匯入
            </button>
            <button id="btn-import-kml" class="btn btn-secondary" title="匯入 KML/GPX">
                🗺️ 匯入地圖
            </button>
            <button id="btn-screenshot" class="btn btn-secondary" title="匯出截圖">
                📷 截圖
            </button>
            <button id="btn-export-pdf" class="btn btn-secondary" title="匯出 PDF">
                📄 PDF
            </button>
            <button id="btn-share" class="btn btn-secondary" title="分享連結">
                🔗 分享
            </button>
            <button id="btn-print" class="btn btn-secondary" title="列印">
                🖨️ 列印
            </button>
            <button id="btn-weather" class="btn btn-secondary" title="天氣圖層">
                🌤️ 天氣
            </button>
            <button id="btn-tutorial" class="btn btn-secondary" title="使用教學">
                ❓ 教學
            </button>
            <button id="btn-export-html" class="btn btn-primary" title="匯出靜態HTML">
                🌐 匯出網頁
            </button>
            <button id="btn-toggle-toolbar" class="btn btn-secondary" title="收合/展開工具列">
                📌 工具列
            </button>
        </div>
    </header>

    <!-- 工具列（上方橫列） -->
    <div class="toolbar-horizontal">
        <!-- 第一列：標記工具 -->
        <div class="toolbar-row">
            <div class="tool-group-inline">
                <span class="tool-group-label">選擇</span>
                <button id="tool-select" class="tool-btn active" data-tool="select" title="選擇/拖曳 (V)">
                    <span class="tool-icon">👆</span>
                    <span class="tool-label">選擇</span>
                </button>
            </div>
            
            <div class="tool-divider"></div>
            
            <div class="tool-group-inline">
                <span class="tool-group-label">標記</span>
                <button id="tool-destination" class="tool-btn" data-tool="destination" title="目的地 (D)">
                    <span class="tool-icon">📍</span>
                    <span class="tool-label">目的地</span>
                </button>
                <button id="tool-parking" class="tool-btn" data-tool="parking" title="停車場 (P)">
                    <span class="tool-icon">🅿️</span>
                    <span class="tool-label">停車場</span>
                </button>
                <button id="tool-roadside" class="tool-btn" data-tool="roadside" title="小車">
                    <span class="tool-icon">🚗</span>
                    <span class="tool-label">小車</span>
                </button>
                <button id="tool-bus" class="tool-btn" data-tool="bus" title="遊覽車停靠點">
                    <span class="tool-icon">🚌</span>
                    <span class="tool-label">遊覽車</span>
                </button>
                <button id="tool-taxi" class="tool-btn" data-tool="taxi" title="計程車/接送點">
                    <span class="tool-icon">🚕</span>
                    <span class="tool-label">計程車</span>
                </button>
                <button id="tool-accessible" class="tool-btn" data-tool="accessible" title="無障礙車位">
                    <span class="tool-icon">♿</span>
                    <span class="tool-label">無障礙</span>
                </button>
            </div>
            
            <div class="tool-divider"></div>
            
            <div class="tool-group-inline">
                <span class="tool-group-label">繪圖</span>
                <button id="tool-text" class="tool-btn" data-tool="text" title="文字方塊 (T)">
                    <span class="tool-icon">💬</span>
                    <span class="tool-label">文字</span>
                </button>
                <button id="tool-route" class="tool-btn" data-tool="route" title="路線/箭頭 (R)">
                    <span class="tool-icon">➡️</span>
                    <span class="tool-label">路線</span>
                </button>
                <button id="tool-draw" class="tool-btn" data-tool="draw" title="畫筆 (B)">
                    <span class="tool-icon">✏️</span>
                    <span class="tool-label">畫筆</span>
                </button>
                <button id="tool-rectangle" class="tool-btn" data-tool="rectangle" title="矩形 (U)">
                    <span class="tool-icon">⬜</span>
                    <span class="tool-label">矩形</span>
                </button>
                <button id="tool-polygon" class="tool-btn" data-tool="polygon" title="多邊形 (G)">
                    <span class="tool-icon">⬡</span>
                    <span class="tool-label">多邊形</span>
                </button>
                <button id="tool-delete" class="tool-btn" data-tool="delete" title="刪除 (Del)">
                    <span class="tool-icon">🗑️</span>
                    <span class="tool-label">刪除</span>
                </button>
                <div class="toolbar-separator"></div>
                <button id="btn-lock-map" class="tool-btn" title="鎖定地圖 (L)">
                    <span class="tool-icon">🔓</span>
                    <span class="tool-label">鎖定</span>
                </button>
            </div>
        </div>
        
        <!-- 第二列：設定區域 -->
        <div class="toolbar-row toolbar-settings">
            <!-- 路線設定 -->
            <div class="setting-group" id="settings-route">
                <span class="setting-label">路線：</span>
                <input type="color" id="route-color" value="#e74c3c" class="color-input" />
                <input type="range" id="route-width" min="2" max="10" step="1" value="4" class="range-input" />
                <select id="route-style" class="select-input">
                    <option value="arrow">箭頭 →</option>
                    <option value="solid">實線 ─</option>
                    <option value="dashed">虛線 - -</option>
                </select>
            </div>
            
            <!-- 畫筆設定 -->
            <div class="setting-group" id="settings-draw">
                <span class="setting-label">畫筆：</span>
                <input type="color" id="draw-color" value="#ff6b6b" class="color-input" />
                <input type="range" id="draw-opacity" min="0.1" max="0.8" step="0.1" value="0.4" class="range-input" />
                <input type="range" id="draw-width" min="5" max="50" step="5" value="20" class="range-input" />
            </div>
            
            <!-- 幾何圖案設定 -->
            <div class="setting-group" id="settings-shape">
                <span class="setting-label">圖案：</span>
                <input type="color" id="shape-color" value="#3498db" class="color-input" />
                <input type="range" id="shape-opacity" min="0.1" max="0.8" step="0.1" value="0.5" class="range-input" />
            </div>
            
            <!-- 圖層控制 -->
            <div class="setting-group">
                <span class="setting-label">圖層：</span>
                <label class="toggle-label"><input type="checkbox" id="layer-destinations" checked /> 📍</label>
                <label class="toggle-label"><input type="checkbox" id="layer-parking" checked /> 🅿️</label>
                <label class="toggle-label"><input type="checkbox" id="layer-roadside" checked /> 🚗</label>
                <label class="toggle-label"><input type="checkbox" id="layer-bus" checked /> 🚌</label>
                <label class="toggle-label"><input type="checkbox" id="layer-taxi" checked /> 🚕</label>
                <label class="toggle-label"><input type="checkbox" id="layer-accessible" checked /> ♿</label>
                <label class="toggle-label"><input type="checkbox" id="layer-routes" checked /> ➡️</label>
                <label class="toggle-label"><input type="checkbox" id="layer-texts" checked /> 💬</label>
                <label class="toggle-label"><input type="checkbox" id="layer-shapes" checked /> ⬜</label>
                <label class="toggle-label"><input type="checkbox" id="layer-drawings" checked /> ✏️</label>
            </div>
            
            <!-- 底圖切換 -->
            <div class="setting-group">
                <span class="setting-label">底圖：</span>
                <label class="toggle-label"><input type="radio" name="basemap" value="osm" checked /> 標準</label>
                <label class="toggle-label"><input type="radio" name="basemap" value="light" /> 淺色</label>
                <label class="toggle-label"><input type="radio" name="basemap" value="satellite" /> 衛星</label>
                <label class="toggle-label"><input type="radio" name="basemap" value="quiet" /> 去符號</label>
            </div>
        </div>
        
        <!-- 路線編輯提示 -->
        <div class="toolbar-row toolbar-hint" id="route-hint" style="display: none;">
            <span class="hint-text">📍 在地圖上點擊繪製路線 | <kbd>ESC</kbd> 或 <kbd>連點兩下</kbd> 結束繪製 | 目前：紅色箭頭</span>
        </div>
        <div class="toolbar-row toolbar-hint" id="draw-hint" style="display: none;">
            <span class="hint-text">✏️ 在地圖上點擊繪製區域 | <kbd>ESC</kbd> 結束繪製</span>
        </div>
        <div class="toolbar-row toolbar-hint" id="polygon-hint" style="display: none;">
            <span class="hint-text">⬡ 在地圖上點擊繪製多邊形 | <kbd>ESC</kbd> 或 <kbd>連點兩下</kbd> 結束繪製</span>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="main-container">
        <!-- 地圖容器 -->
        <div id="map" class="map-container"></div>

        <!-- 右側屬性面板 -->
        <aside id="properties-panel" class="properties-panel hidden">
            <div class="panel-header">
                <h3 class="panel-title">屬性編輯</h3>
                <button id="btn-close-panel" class="btn-icon" title="關閉">✕</button>
            </div>
            <div class="panel-body">
                <!-- 目的地屬性 -->
                <div id="props-destination" class="props-section hidden">
                    <label>
                        名稱
                        <input type="text" id="prop-dest-name" placeholder="例如：活動會場" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-dest-note" placeholder="例如：從捷運站步行5分鐘"></textarea>
                    </label>
                    <label>
                        圖標顏色
                        <input type="color" id="prop-dest-color" value="#e74c3c" />
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-dest-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-dest-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 停車場屬性 -->
                <div id="props-parking" class="props-section hidden">
                    <label>
                        名稱
                        <input type="text" id="prop-parking-name" placeholder="例如：XX停車場" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-parking-note" placeholder="例如：每小時30元"></textarea>
                    </label>
                    <label>
                        圖標顏色
                        <input type="color" id="prop-parking-color" value="#3498db" />
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-parking-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-parking-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 小車屬性 -->
                <div id="props-roadside" class="props-section hidden">
                    <label>
                        路段名稱
                        <input type="text" id="prop-roadside-name" placeholder="例如：中山路一段" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-roadside-note" placeholder="例如： Monday to Friday 8am-6pm"></textarea>
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-roadside-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-roadside-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 遊覽車屬性 -->
                <div id="props-bus" class="props-section hidden">
                    <label>
                        名稱
                        <input type="text" id="prop-bus-name" placeholder="例如：遊覽車停靠區A" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-bus-note" placeholder="例如：可停3輛遊覽車"></textarea>
                    </label>
                    <label>
                        圖標顏色
                        <input type="color" id="prop-bus-color" value="#27ae60" />
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-bus-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-bus-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 計程車屬性 -->
                <div id="props-taxi" class="props-section hidden">
                    <label>
                        名稱
                        <input type="text" id="prop-taxi-name" placeholder="例如：計程車搭乘處" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-taxi-note" placeholder="例如：排隊等候區"></textarea>
                    </label>
                    <label>
                        圖標顏色
                        <input type="color" id="prop-taxi-color" value="#f1c40f" />
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-taxi-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-taxi-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 無障礙車位屬性 -->
                <div id="props-accessible" class="props-section hidden">
                    <label>
                        名稱
                        <input type="text" id="prop-accessible-name" placeholder="例如：無障礙車位" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-accessible-note" placeholder="例如：需出示身心障礙手冊"></textarea>
                    </label>
                    <label>
                        圖標顏色
                        <input type="color" id="prop-accessible-color" value="#3498db" />
                    </label>
                    <label>
                        標籤顯示
                        <select id="prop-accessible-labelmode">
                            <option value="none">隱藏</option>
                            <option value="always">顯示</option>
                            <option value="hover">懸停顯示</option>
                        </select>
                    </label>
                    <label>
                        標籤位置
                        <select id="prop-accessible-labelpos">
                            <option value="left">左方</option>
                            <option value="right">右方</option>
                            <option value="below">下方</option>
                            <option value="on">標記上</option>
                        </select>
                    </label>
                </div>

                <!-- 文字方塊屬性 -->
                <div id="props-text" class="props-section hidden">
                    <label>
                        文字內容
                        <textarea id="prop-text-content" placeholder="例如：請往這邊走"></textarea>
                    </label>
                    <label>
                        字型大小
                        <select id="prop-text-size">
                            <option value="12">小</option>
                            <option value="16" selected>中</option>
                            <option value="20">大</option>
                            <option value="28">特大</option>
                        </select>
                    </label>
                    <label>
                        背景顏色
                        <input type="color" id="prop-text-bg" value="#ffffff" />
                    </label>
                    <label>
                        文字顏色
                        <input type="color" id="prop-text-color" value="#333333" />
                    </label>
                    <button id="btn-delete-text" class="btn btn-danger btn-full">
                        刪除這個文字
                    </button>
                </div>

                <!-- 路線屬性 -->
                <div id="props-route" class="props-section hidden">
                    <label>
                        路線名稱
                        <input type="text" id="prop-route-name" placeholder="例如：主要動線" />
                    </label>
                    <label>
                        備註
                        <textarea id="prop-route-note" placeholder="例如：從停車場到會場"></textarea>
                    </label>
                    <button id="btn-delete-route" class="btn btn-danger btn-full">
                        刪除這條路線
                    </button>
                </div>

                <!-- 幾何圖案屬性 -->
                <div id="props-shape" class="props-section hidden">
                    <label>
                        標籤
                        <input type="text" id="prop-shape-label" placeholder="例如：活動區域" />
                    </label>
                    <button id="btn-delete-shape" class="btn btn-danger btn-full">
                        刪除這個圖案
                    </button>
                </div>

                <!-- 畫筆屬性 -->
                <div id="props-draw" class="props-section hidden">
                    <label>
                        標籤
                        <input type="text" id="prop-draw-label" placeholder="例如：可停車路段" />
                    </label>
                    <button id="btn-delete-drawing" class="btn btn-danger btn-full">
                        刪除這個標記
                    </button>
                </div>

                <div class="panel-actions">
                    <button id="btn-apply-props" class="btn btn-primary btn-full">
                        套用變更
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- 專案管理對話框 -->
    <dialog id="dialog-projects" class="dialog">
        <div class="dialog-header">
            <h2>📁 專案管理</h2>
            <button id="btn-close-projects" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <div class="project-actions">
                <button id="btn-new-project" class="btn btn-primary">
                    ➕ 新增專案
                </button>
            </div>
            <div id="project-list" class="project-list">
                <!-- 專案列表會動態產生 -->
            </div>
        </div>
    </dialog>

    <!-- 匯入對話框 -->
    <dialog id="dialog-import" class="dialog">
        <div class="dialog-header">
            <h2>📂 匯入專案</h2>
            <button id="btn-close-import" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <div class="import-zone">
                <input type="file" id="file-import" accept=".json" hidden />
                <label for="file-import" class="import-label">
                    <span class="import-icon">📄</span>
                    <span>點擊選擇 JSON 檔案</span>
                    <span class="import-hint">或拖曳檔案到這裡</span>
                </label>
            </div>
        </div>
    </dialog>

    <!-- 新增專案對話框 -->
    <dialog id="dialog-new-project" class="dialog">
        <div class="dialog-header">
            <h2>➕ 新增專案</h2>
            <button id="btn-close-new-project" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <label>
                專案名稱
                <input type="text" id="new-project-name" placeholder="例如：2024 音樂節" />
            </label>
            <label>
                活動日期（選填）
                <input type="date" id="new-project-date" />
            </label>
            <label>
                備註（選填）
                <textarea id="new-project-note" placeholder="活動簡述"></textarea>
            </label>
            <div class="dialog-actions">
                <button id="btn-cancel-new-project" class="btn btn-secondary">取消</button>
                <button id="btn-confirm-new-project" class="btn btn-primary">建立</button>
            </div>
        </div>
    </dialog>

    <!-- 新增文字方塊對話框 -->
    <dialog id="dialog-text" class="dialog">
        <div class="dialog-header">
            <h2>💬 新增文字方塊</h2>
            <button id="btn-close-text" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <label>
                文字內容
                <textarea id="input-text-content" placeholder="例如：請往這邊走" rows="3"></textarea>
            </label>
            <div class="dialog-actions">
                <button id="btn-cancel-text" class="btn btn-secondary">取消</button>
                <button id="btn-confirm-text" class="btn btn-primary">確定</button>
            </div>
        </div>
    </dialog>

    <!-- 活動資訊卡片對話框 -->
    <dialog id="dialog-event-info" class="dialog dialog-wide">
        <div class="dialog-header">
            <h2>📋 活動資訊</h2>
            <button id="btn-close-event-info" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <div class="event-info-grid">
                <label>
                    活動名稱
                    <input type="text" id="event-name" placeholder="例如：2024 音樂節" />
                </label>
                <label>
                    活動日期
                    <input type="date" id="event-date" />
                </label>
                <label>
                    活動時間
                    <input type="text" id="event-time" placeholder="例如：10:00 - 22:00" />
                </label>
                <label>
                    活動地址
                    <input type="text" id="event-address" placeholder="例如：台北市信義區松壽路20號" />
                </label>
                <label>
                    主辦單位
                    <input type="text" id="event-organizer" placeholder="例如：XX文化基金會" />
                </label>
                <label>
                    聯絡電話
                    <input type="text" id="event-phone" placeholder="例如：02-12345678" />
                </label>
                <label>
                    聯絡信箱
                    <input type="email" id="event-email" placeholder="例如：info@example.com" />
                </label>
                <label>
                    活動網址
                    <input type="url" id="event-url" placeholder="例如：https://example.com" />
                </label>
                <label class="full-width">
                    活動說明
                    <textarea id="event-description" placeholder="活動簡述、注意事項等" rows="3"></textarea>
                </label>
                <label class="full-width">
                    交通資訊
                    <textarea id="event-transport" placeholder="例如：捷運板南線市政府站3號出口步行5分鐘" rows="3"></textarea>
                </label>
            </div>
            <div class="dialog-actions">
                <button id="btn-cancel-event-info" class="btn btn-secondary">取消</button>
                <button id="btn-confirm-event-info" class="btn btn-primary">儲存</button>
            </div>
        </div>
    </dialog>

    <!-- 匯入 KML/GPX 對話框 -->
    <dialog id="dialog-import-kml" class="dialog">
        <div class="dialog-header">
            <h2>🗺️ 匯入 KML/GPX</h2>
            <button id="btn-close-import-kml" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <div class="import-zone">
                <input type="file" id="file-import-kml" accept=".kml,.gpx,.xml" hidden />
                <label for="file-import-kml" class="import-label">
                    <span class="import-icon">🗺️</span>
                    <span>點擊選擇 KML 或 GPX 檔案</span>
                    <span class="import-hint">支援 Google My Maps、GPS 裝置匯出的檔案</span>
                </label>
            </div>
        </div>
    </dialog>

    <!-- 分享連結對話框 -->
    <dialog id="dialog-share" class="dialog">
        <div class="dialog-header">
            <h2>🔗 分享連結</h2>
            <button id="btn-close-share" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <p class="share-info">產生一個唯讀的檢視頁面，參與者可以看到地圖但無法編輯。</p>
            <div id="share-qr" class="share-qr"></div>
            <div class="share-link-box">
                <input type="text" id="share-link" readonly placeholder="產生中..." />
                <button id="btn-copy-share-link" class="btn btn-primary">複製</button>
            </div>
            <div class="dialog-actions">
                <button id="btn-cancel-share" class="btn btn-secondary">關閉</button>
                <button id="btn-download-share" class="btn btn-primary">下載檢視頁面</button>
            </div>
        </div>
    </dialog>

    <!-- 天氣圖層對話框 -->
    <dialog id="dialog-weather" class="dialog">
        <div class="dialog-header">
            <h2>🌤️ 天氣資訊</h2>
            <button id="btn-close-weather" class="btn-icon">✕</button>
        </div>
        <div class="dialog-body">
            <p class="weather-info">顯示活動地點的即時天氣資訊。</p>
            <div id="weather-display" class="weather-display">
                <p>請先在「活動資訊」中設定活動地址。</p>
            </div>
            <div class="dialog-actions">
                <button id="btn-cancel-weather" class="btn btn-secondary">關閉</button>
                <button id="btn-refresh-weather" class="btn btn-primary">重新整理</button>
            </div>
        </div>
    </dialog>

    <!-- Undo 提示 -->
    <div id="undo-toast" class="toast hidden">
        <span id="undo-message"></span>
        <button id="btn-undo" class="btn btn-primary btn-sm">還原 (Ctrl+Z)</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- jsPDF (PDF 匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- html2canvas (截圖) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Intro.js (教學提示) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.0.0/intro.min.js"></script>
    
    <!-- 主要邏輯 -->
    <script src="app.js"></script>
</body>
</html>
